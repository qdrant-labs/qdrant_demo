[tool.poetry]
name = "qdrant_demo"
version = "0.1.0"
description = "Indexing scripts for the Qdrant startup search demo"
authors = ["Andrey Vasnetsov <andrey@vasnetsov.com>"]

[tool.poetry.dependencies]
python = "~3.11"
pandas = "^2.2.3"
tqdm = "^4.66.1"
# Only the indexing scripts are left, so this is the client and what they use to
# read the source data. No fastembed extra: queries are embedded by Qdrant Cloud
# Inference, and the extra pulled in a charset_normalizer build that crashed.
# 1.14 is the floor for cloud_inference; the collection also needs a Qdrant
# server at 1.10 or newer for the fusion step in the hybrid query.
qdrant-client = ">=1.14.2"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
